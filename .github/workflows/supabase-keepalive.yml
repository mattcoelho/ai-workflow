name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 * * *'  # noon UTC (5am PST) daily
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase keep_alive table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"

          STATUS=$(
            curl --silent --show-error --location \
              --output "$response_file" \
              --write-out "%{http_code}" \
              "${SUPABASE_URL%/}/rest/v1/keep_alive?select=*&limit=1" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Accept: application/json"
          ) || STATUS="000"

          echo "Response: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase keepalive failed with status $STATUS"
            cat "$response_file" || true
            exit 1
          fi

          echo "Supabase keepalive query succeeded"
